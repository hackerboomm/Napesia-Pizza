<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napesia Pizza | Margherita</title>
    <link rel="stylesheet" href="margherita.css">
</head>
<body>
    <div class="breaker"></div>
    <div class="pizzaPresentationSection">
        <div class="pizzaBigImageBox">
            <img src="pizzas/pizza-big-image.png" alt="Big Pizza Image" class="pizzaBigImage">
        </div>
        <h2 class="pizzaDescriptionSubtitle">Pizza Margherita</h2>
    </div>
    <div class="pizzaDescriptionSection">
        <div class="pizzaDescriptionBox">
            <div class="pizzaElementGroup">
                <img src="icons/sauce-icon.png" alt="Tomato Icon" class="pizzaElementImage">
                <p class="pizzaDescriptionElement">Domates Sosu</p>
            </div>
            <div class="pizzaElementGroup">
                <img src="icons/leaf-icon.png" alt="Leaf Icon" class="pizzaElementImage">
                <p class="pizzaDescriptionElement">Taze Fesleğen</p>
            </div>
            <div class="pizzaElementGroup">
                <img src="icons/cheese-icon.png" alt="Cheese Icon" class="pizzaElementImage">
                <p class="pizzaDescriptionElement">Taze Peynir</p>
            </div>
        </div>
    </div>
    <div class="breaker"></div>

</body>
</html>
